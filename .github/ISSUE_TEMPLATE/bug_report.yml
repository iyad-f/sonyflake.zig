name: Bug Report
description: Report broken or incorrect behaviour
title: "[Bug]: "
labels: ["unconfirmed bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report.
  - type: input
    attributes:
      label: Summary
      description: A short summary of the bug.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: What you did to trigger it.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal reproducible example
      description: A short Zig snippet that shows the bug, if you can provide one.
      render: zig
  - type: textarea
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behaviour
      description: "What actually happened: an error, a panic, a hang, a wrong id. Include the full error or panic output if there is one."
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: The sonyflake version (or commit) and your Zig version (`zig version`).
      placeholder: "sonyflake 0.1.0, zig 0.16.0"
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system
      placeholder: "macOS 26, Ubuntu 26.04, Windows 11"
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing issues for duplicates.
          required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Anything else that might help.
