name: Feature Request
description: Suggest an idea or improvement for the library
title: "[Feature]: "
labels: [enhancement]
body:
  - type: input
    attributes:
      label: Summary
      description: A short summary of the feature.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Problem
      description: What problem does this solve? What becomes easier or possible?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: What would you like it to do?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      description: Any current workarounds or alternatives you have considered.
  - type: textarea
    attributes:
      label: Additional context
